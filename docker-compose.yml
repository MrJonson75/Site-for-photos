services:
  # Основное приложение FastAPI
  image_host_web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: site-foto-web
    restart: unless-stopped
    volumes:
      - ./static:/app/static    # Статические файлы
      - ./logs:/app/logs          # Логи
    expose:
      - "8000"  # Открыт только для внутренней сети, не наружу
    depends_on:
      - db
    networks:
      - internal

  # Обратный прокси nginx
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"  # Проброс наружу
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro  # Конфиг nginx
      - ./static:/app/static:ro  # Статические файлы
    depends_on:
      - image_host_web
    networks:
      - internal

  # Собственный контейнер для базы данных
  db:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${P_USER}
      POSTGRES_PASSWORD: ${P_PASSWORD}
      POSTGRES_DB: ${P_DB}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - internal

  # Собственный контейнер для pgAdmin
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      SCRIPT_NAME: "/pgadmin"  # Указываем базовый путь
    ports:
      - "5050:5050"
    volumes:
      - ./pgadmin_data:/var/lib/pgadmin
      - ./pgadmin_config:/root/.pgadmin
      - ./pgadmin_import:/backups
      - ./pgadmin_import:/import
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - internal

networks:
  internal:  # Внутренняя сеть
    driver: bridge


