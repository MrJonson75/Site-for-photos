version: '3.8'

services:
  # Основное приложение FastAPI
  image_host_web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: site-foto-web
    restart: unless-stopped
    volumes:
      - images:/app/static/images
      - logs:/app/logs
    expose:
      - "8000"  # Открыт только для внутренней сети, не наружу
    networks:
      - internal

  # Обратный прокси nginx
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"  # Проброс наружу
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro  # Конфиг nginx
      - ./static:/app/static:ro  # Статические файлы
    depends_on:
      - image_host_web
    networks:
      - internal

networks:
  internal:  # Внутренняя сеть
    driver: bridge

volumes:
  images:
  logs:
